<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cake Lab — Sản Phẩm</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e11; --surface:#1a1820; --surface2:#231f2e;
  --border:rgba(255,255,255,0.07);
  --accent:#f5c842; --accent2:#ff8c5a; --accent3:#7ee8a2; --accent4:#60c4f7;
  --red:#ff5c5c; --text:#f0ecff; --muted:#8b879d; --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
.nav{background:rgba(15,14,17,.95);backdrop-filter:blur(12px);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.nav-l{display:flex;align-items:center;gap:10px}
.nav-back{color:var(--accent);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .15s;font-weight:500}
.nav-back:hover{color:var(--text)}
.nav-sep{color:var(--border);margin:0 4px}
.nav-title{font-family:'Fraunces',serif;font-size:18px;color:var(--text);font-weight:300}
.nav-badge{background:rgba(245,200,66,.15);color:var(--accent);border:1px solid rgba(245,200,66,.3);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}

/* HERO */
.hero{background:linear-gradient(135deg,#1a1624 0%,#0f0e11 100%);padding:34px 36px 30px;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(245,200,66,.07) 0%,transparent 70%);pointer-events:none}
.hero::after{content:'📦';position:absolute;right:-8px;top:-16px;font-size:180px;opacity:.03;pointer-events:none}
.hero-label{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.hero-title{font-family:'Fraunces',serif;font-size:34px;font-weight:300;color:var(--text);line-height:1.1;margin-bottom:5px}
.hero-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap}
.hstat{border-left:2px solid rgba(245,200,66,.3);padding-left:12px}
.hstat-v{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--text)}
.hstat-l{font-size:10.5px;color:var(--muted);margin-top:2px}

/* TOOLBAR */
.toolbar{background:rgba(26,24,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:sticky;top:52px;z-index:99}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:300px}
.search-wrap input{width:100%;padding:8px 13px 8px 36px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--surface);color:var(--text);font-family:'Be Vietnam Pro',sans-serif;outline:none;transition:border-color .15s}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:rgba(245,200,66,.5)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.fi{padding:8px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:12.5px;background:var(--surface);color:var(--text);font-family:'Be Vietnam Pro',sans-serif;outline:none;cursor:pointer}
.fi:focus{border-color:rgba(245,200,66,.5)}
.view-btns{display:flex;gap:4px;margin-left:auto}
.view-btn{width:32px;height:32px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;color:var(--muted)}
.view-btn.active,.view-btn:hover{background:rgba(245,200,66,.12);border-color:rgba(245,200,66,.4);color:var(--accent)}
.count-tag{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}

/* MAIN */
.main{max-width:1280px;margin:0 auto;padding:24px 20px 56px}

/* GROUP HEADER */
.group-hdr{display:flex;align-items:center;gap:10px;margin:24px 0 12px}
.group-hdr-line{flex:1;height:1px;background:var(--border)}
.group-hdr-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 4px;white-space:nowrap}
.group-hdr-count{background:rgba(245,200,66,.12);color:var(--accent);border:1px solid rgba(245,200,66,.25);border-radius:20px;padding:2px 8px;font-size:10.5px;font-weight:700}

/* CARD GRID */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card-grid.list-mode{grid-template-columns:1fr}

/* PRODUCT CARD */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(0,0,0,.4);border-color:rgba(245,200,66,.25)}
.pcard-img{width:100%;height:155px;object-fit:contain;object-position:center;background:var(--surface2);display:block}
.pcard-img-placeholder{width:100%;height:155px;display:flex;align-items:center;justify-content:center;font-size:38px}
.pcard-body{padding:11px 13px 13px}
.pcard-nhom{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pcard-name{font-family:'Fraunces',serif;font-size:15px;font-weight:300;color:var(--text);line-height:1.3;margin-bottom:5px}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.pcard-price{font-size:14px;font-weight:700;color:var(--accent)}
.pcard-dvt{font-size:10.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 7px}
.pcard-ma{font-size:10.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}

/* LIST MODE */
.card-grid.list-mode .pcard{display:flex;align-items:stretch}
.card-grid.list-mode .pcard-img{width:90px;height:70px;flex-shrink:0;border-radius:0}
.card-grid.list-mode .pcard-img-placeholder{width:90px;height:70px;flex-shrink:0;font-size:22px;border-radius:0}
.card-grid.list-mode .pcard-body{display:flex;align-items:center;gap:14px;flex:1;padding:10px 14px}
.card-grid.list-mode .pcard-name{font-size:13.5px;margin-bottom:0;flex:1}
.card-grid.list-mode .pcard-nhom{margin-bottom:0;white-space:nowrap}
.card-grid.list-mode .pcard-foot{flex-shrink:0;flex-direction:column;align-items:flex-end;gap:3px}
.card-grid.list-mode .pcard-ma{margin-top:0}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:620px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-img{width:100%;height:280px;object-fit:contain;object-position:center;background:var(--surface2);border-radius:18px 18px 0 0}
.modal-img-ph{width:100%;height:200px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:68px;border-radius:18px 18px 0 0}
.modal-body{padding:22px 26px 26px}
.modal-nhom{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.modal-name{font-family:'Fraunces',serif;font-size:24px;font-weight:300;color:var(--text);margin-bottom:3px}
.modal-ma{font-size:11.5px;color:var(--accent);margin-bottom:14px;font-variant-numeric:tabular-nums}
.modal-price{font-size:22px;font-weight:700;color:var(--accent);margin-bottom:12px}
.modal-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px}
.modal-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:5px}
.modal-chip{background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.25);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:500;color:var(--accent)}
.modal-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:var(--text);border:1px solid var(--border);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.modal-close:hover{background:rgba(255,255,255,.1)}
.modal-wrap{position:relative}

/* LOADING / EMPTY */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:12px}
.spinner{width:38px;height:38px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:10px}

/* NHOM COLORS - background per group */
.nhom-kem{background:linear-gradient(135deg,#2a1f3a,#1e1a2e)}
.nhom-bsn{background:linear-gradient(135deg,#2e1a1a,#231515)}
.nhom-mi{background:linear-gradient(135deg,#1a2e1e,#152318)}
.nhom-quy{background:linear-gradient(135deg,#1a1e2e,#151823)}
.nhom-them{background:linear-gradient(135deg,#251a2e,#1e1523)}
.nhom-other{background:var(--surface2)}

@media(max-width:768px){
  .nav{padding:0 14px;height:48px}
  .nav-badge{font-size:10px}
  .hero{padding:20px 14px 24px}.hero-title{font-size:26px}
  .toolbar{padding:9px 12px;top:48px}
  .search-wrap{max-width:100%;flex:1 1 100%}
  .fi{font-size:12px;flex:1}
  .view-btns{display:none}
  .count-tag{width:100%;text-align:right}
  .main{padding:12px 10px 44px}
  .card-grid{grid-template-columns:repeat(2,1fr);gap:9px}
  .pcard-img,.pcard-img-placeholder{height:115px}
  .pcard-body{padding:9px 11px 11px}
  .pcard-name{font-size:13px}
  .pcard-price{font-size:13px}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;width:100%}
  .modal-img{height:240px}.modal-img-ph{height:160px;border-radius:18px 18px 0 0}
  .modal-body{padding:16px 16px 32px}
  .modal-name{font-size:20px}.modal-price{font-size:18px}
}
@media(max-width:380px){
  .card-grid{grid-template-columns:1fr}
  .pcard-img,.pcard-img-placeholder{height:160px}
}
</style>
</head>
<body>
<script>
// AUTH GUARD — BGĐ hoặc Khách (chỉ xem Danh mục sản phẩm)
(function() {
  const raw = sessionStorage.getItem('tcl_user');
  if (!raw) { window.location.replace('login.html'); return; }
  const user = JSON.parse(raw);
  if (user.role !== 'bgd' && user.role !== 'khach') { window.location.replace('login.html'); return; }
  window.TCL_USER_ROLE = user.role;
  if (user.role === 'khach') {
    document.addEventListener('DOMContentLoaded', function() {
      var backLink = document.getElementById('navBackLink');
      if (backLink) backLink.style.display = 'none';
    });
  }
})();
</script>

<nav class="nav">
  <div class="nav-l">
    <a class="nav-back" href="index.html" id="navBackLink">← Trang chủ</a>
    <span class="nav-sep">/</span>
    <span class="nav-title">Sản Phẩm</span>
  </div>
  <div class="nav-badge" id="nav-count">Đang tải...</div>
<button onclick="(function(){sessionStorage.removeItem('tcl_user');window.location.href='login.html';})()" style="padding:5px 13px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#8b879d;font-size:12px;font-weight:500;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;margin-left:12px" onmouseover="this.style.color='#ff5c5c';this.style.borderColor='rgba(255,92,92,.4)'" onmouseout="this.style.color='#8b879d';this.style.borderColor='rgba(255,255,255,.12)'">Đăng xuất</button>
</nav>

<div class="hero">
  <div class="hero-label">Module 1 · The Cake Lab</div>
  <h1 class="hero-title">Danh Mục Sản Phẩm</h1>
  <p class="hero-sub">Toàn bộ sản phẩm đồng bộ trực tiếp từ Google Sheets · ảnh live</p>
  <div class="hero-stats">
    <div class="hstat"><div class="hstat-v" id="stat-total">—</div><div class="hstat-l">Sản phẩm</div></div>
    <div class="hstat"><div class="hstat-v" id="stat-nhom">—</div><div class="hstat-l">Nhóm</div></div>
    <div class="hstat"><div class="hstat-v" id="stat-gia">—</div><div class="hstat-l">Giá trung bình</div></div>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Tìm tên, mã sản phẩm..." oninput="renderProducts()">
  </div>
  <select class="fi" id="f-nhom" onchange="renderProducts()"><option value="">Tất cả nhóm</option></select>
  <select class="fi" id="f-loai" onchange="renderProducts()"><option value="">Tất cả loại</option></select>
  <select class="fi" id="f-sort" onchange="renderProducts()">
    <option value="name">Tên A-Z</option>
    <option value="price-asc">Giá tăng dần</option>
    <option value="price-desc">Giá giảm dần</option>
    <option value="ma">Mã SP</option>
  </select>
  <div class="view-btns">
    <button class="view-btn active" id="btn-grid" onclick="setView('grid')" title="Lưới">⊞</button>
    <button class="view-btn" id="btn-list" onclick="setView('list')" title="Danh sách">☰</button>
  </div>
  <span class="count-tag" id="count-tag"></span>
</div>

<div class="main" id="main-content">
  <div class="loading"><div class="spinner"></div><div class="load-txt">Đang tải dữ liệu từ Google Sheets...</div></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-wrap">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbykaEKRNFHJr0JnGd88R8AcRtKgzAC3wWUkWQxC1xIxoAUJFSP1hURXkBrHS4SconAl/exec';
let ALL = [];
let VIEW = 'grid';

async function loadData() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const rows = Array.isArray(json) ? json : (json.data || []);
    if (!rows.length) throw new Error('Không có dữ liệu');
    ALL = rows.filter(p => p && p.ma && /^\d/.test(String(p.ma)));
    populateFilters();
    renderStats();
    renderProducts();
  } catch(e) { showError(e.message); }
}

function showError(msg='') {
  document.getElementById('main-content').innerHTML = `
    <div class="empty">
      <div class="empty-icon">⚠️</div>
      <h3 style="color:var(--red);margin-bottom:8px">Không thể tải dữ liệu</h3>
      <p style="font-size:13px;color:var(--muted);max-width:420px;margin:0 auto;line-height:1.7">
        ${msg?'<code style="background:var(--surface2);padding:2px 6px;border-radius:4px;font-size:11.5px">'+msg+'</code><br><br>':''}
        Kiểm tra lại Apps Script deployment và quyền truy cập.<br>
        <a href="${API_URL}" target="_blank" style="color:var(--accent)">→ Thử mở API trực tiếp</a>
      </p>
    </div>`;
}

function populateFilters() {
  const nhoms = [...new Set(ALL.map(p => p.nhom).filter(Boolean))].sort();
  const loais = [...new Set(ALL.map(p => p.loai).filter(Boolean))].sort();
  document.getElementById('f-nhom').innerHTML = '<option value="">Tất cả nhóm</option>' + nhoms.map(n=>`<option>${n}</option>`).join('');
  document.getElementById('f-loai').innerHTML = '<option value="">Tất cả loại</option>' + loais.map(n=>`<option>${n}</option>`).join('');
}

function renderStats() {
  const nhoms = new Set(ALL.map(p=>p.nhom).filter(Boolean));
  const avg = ALL.length ? Math.round(ALL.reduce((s,p)=>s+p.gia,0)/ALL.length) : 0;
  document.getElementById('stat-total').textContent = ALL.length;
  document.getElementById('stat-nhom').textContent = nhoms.size;
  document.getElementById('stat-gia').textContent = (avg/1000).toFixed(0)+'k';
  document.getElementById('nav-count').textContent = ALL.length+' sản phẩm';
}

function renderProducts() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const nhomF = document.getElementById('f-nhom').value;
  const loaiF = document.getElementById('f-loai').value;
  const sort = document.getElementById('f-sort').value;

  let filtered = ALL.filter(p => {
    if (nhomF && p.nhom!==nhomF) return false;
    if (loaiF && p.loai!==loaiF) return false;
    if (search && !p.ten.toLowerCase().includes(search) &&
        !p.ten_raw.toLowerCase().includes(search) && !p.ma.includes(search)) return false;
    return true;
  });

  if (sort==='name') filtered.sort((a,b)=>a.ten.localeCompare(b.ten,'vi'));
  else if (sort==='price-asc') filtered.sort((a,b)=>a.gia-b.gia);
  else if (sort==='price-desc') filtered.sort((a,b)=>b.gia-a.gia);
  else filtered.sort((a,b)=>a.ma.localeCompare(b.ma));

  document.getElementById('count-tag').textContent = filtered.length+' sản phẩm';

  if (!filtered.length) {
    document.getElementById('main-content').innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>Không tìm thấy sản phẩm nào</p></div>';
    return;
  }

  const groups={};
  filtered.forEach(p=>{ const g=p.nhom||'Khác'; if(!groups[g])groups[g]=[]; groups[g].push(p); });

  const NHOM_ICON={'BÁNH KEM NHỎ':'🎂','BÁNH KEM SINH NHẬT':'🎁','BÁNH MÌ':'🥐','BÁNH QUY':'🍪','ĐỒ ĂN KÈM':'🫙'};
  const NHOM_CLS={'BÁNH KEM NHỎ':'nhom-kem','BÁNH KEM SINH NHẬT':'nhom-bsn','BÁNH MÌ':'nhom-mi','BÁNH QUY':'nhom-quy','ĐỒ ĂN KÈM':'nhom-them'};

  let html='';
  for (const [nhom,items] of Object.entries(groups)) {
    const icon=NHOM_ICON[nhom]||'📦';
    const cls=NHOM_CLS[nhom]||'nhom-other';
    html+=`<div class="group-hdr">
      <div class="group-hdr-label">${icon} ${nhom}</div>
      <div class="group-hdr-count">${items.length}</div>
      <div class="group-hdr-line"></div>
    </div>
    <div class="card-grid${VIEW==='list'?' list-mode':''}">
      ${items.map(p=>cardHTML(p,cls)).join('')}
    </div>`;
  }
  document.getElementById('main-content').innerHTML=html;
}

function nhomEmoji(nhom=''){
  const u=nhom.toUpperCase();
  if(u.includes('SINH NHẬT')) return '🎁';
  if(u.includes('KEM')) return '🎂';
  if(u.includes('MÌ')) return '🥐';
  if(u.includes('QUY')) return '🍪';
  if(u.includes('ĂN KÈM')) return '🫙';
  return '🍰';
}

function fmtGia(g){ return g?g.toLocaleString('vi-VN')+' đ':'—'; }

function imgHTML(p,phCls,nhomCls) {
  const isReal=p.img&&p.img.startsWith('http')&&!p.img.includes('CellImage');
  if(isReal) return `<img class="pcard-img" src="${p.img}" alt="${p.ten}" loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="${phCls} ${nhomCls}" style="display:none">${nhomEmoji(p.nhom)}</div>`;
  return `<div class="${phCls} ${nhomCls}">${nhomEmoji(p.nhom)}</div>`;
}

function cardHTML(p,nhomCls) {
  const idx=ALL.indexOf(p);
  return `<div class="pcard" onclick="openModal(${idx})">
    ${imgHTML(p,'pcard-img-placeholder',nhomCls)}
    <div class="pcard-body">
      <div class="pcard-nhom">${p.loai||p.nhom}</div>
      <div class="pcard-name">${p.ten}</div>
      <div class="pcard-foot">
        <div class="pcard-price">${fmtGia(p.gia)}</div>
        <div class="pcard-dvt">${p.dvt}</div>
      </div>
      <div class="pcard-ma">${p.ma}</div>
    </div>
  </div>`;
}

function openModal(idx) {
  const p=ALL[idx]; if(!p) return;
  const imgPart=p.img
    ?`<img class="modal-img" src="${p.img}" alt="${p.ten}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="modal-img-ph" style="display:none">${nhomEmoji(p.nhom)}</div>`
    :`<div class="modal-img-ph">${nhomEmoji(p.nhom)}</div>`;
  document.getElementById('modal-content').innerHTML=`
    ${imgPart}
    <div class="modal-body">
      <div class="modal-nhom">${p.nhom} · ${p.loai}</div>
      <div class="modal-name">${p.ten}</div>
      <div class="modal-ma">${p.ma}</div>
      <div class="modal-price">${fmtGia(p.gia)}</div>
      ${p.mo_ta?`<div class="modal-desc">${p.mo_ta.replace(/\n/g,'<br>')}</div>`:''}
      <div class="modal-row">
        <span class="modal-chip">📦 ${p.dvt}</span>
        <span class="modal-chip">🏷 ${p.loai}</span>
        <span class="modal-chip">🗂 ${p.nhom}</span>
      </div>
    </div>`;
  document.getElementById('modal-bg').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e) {
  if(e&&e.target!==document.getElementById('modal-bg')&&!e.target.classList.contains('modal-close')) return;
  document.getElementById('modal-bg').classList.remove('open');
  document.body.style.overflow='';
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal({target:document.getElementById('modal-bg')}); });

function setView(v) {
  VIEW=v;
  document.getElementById('btn-grid').classList.toggle('active',v==='grid');
  document.getElementById('btn-list').classList.toggle('active',v==='list');
  renderProducts();
}

loadData();
</script>
</body>
</html>
